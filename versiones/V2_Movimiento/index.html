<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conducción Nocturna — Versión 2 en desarrollo</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, Arial, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #090e1b; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; width: 100%; height: 100%; }
    #titulo { position: fixed; top: 18px; left: 20px; background: rgba(9,16,30,.77);
      border: 1px solid rgba(190,206,241,.19); border-radius: 12px; padding: 14px 17px;
      color: #edf2fb; pointer-events: none; max-width: 370px; }
    #titulo h1 { margin: 0 0 3px; font-size: clamp(17px, 2.7vw, 22px); letter-spacing: .01em; }
    #titulo p { margin: 2px 0; font-size: 12px; line-height: 1.6; color: #bac5d9; }
    #nota { position: fixed; bottom: 18px; left: 20px; background: rgba(9,16,30,.78);
      border: 1px solid rgba(190,206,241,.15); border-radius: 10px; padding: 10px 14px;
      font-size: 12px; color: #c7d4e5; max-width: min(450px, calc(100vw - 40px)); }
    #error { position: fixed; inset: 0; display: none; place-items: center; padding: 28px;
      background: #10172a; color: #f5e6dc; font-size: 18px; text-align: center; }
    #error > div { max-width: 650px; line-height: 1.5; }
    @media (max-width: 600px) { #titulo { top: 10px; left: 10px; right: 10px; padding: 10px; }
      #nota { bottom: 9px; left: 10px; right: 10px; } }
  </style>
</head>
<body>
  <main id="app" aria-label="Escenario tridimensional"></main>
  <section id="titulo">
    <h1>Conducción Nocturna</h1>
    <p>Informática 3 · Three.js</p>
    <p><strong>Versión 2 en desarrollo:</strong> conducción y cámara en tercera persona.</p>
  </section>
  <aside id="nota">
    W / ↑: avanzar · S / ↓: retroceder.<br>
    A / ←: dirección izquierda · D / →: dirección derecha.<br>
    Combiná avance o retroceso con dirección para girar. Sin colisiones con edificios.
  </aside>
  <section id="error"><div id="mensaje-error"></div></section>

  <!-- Primero busca la biblioteca dentro de la carpeta (uso sin Internet). -->
  <script src="./vendor/three.min.js"></script>
  <!-- Si aún no se preparó el archivo local, usa el CDN clásico (requiere Internet). -->
  <script>
    if (typeof window.THREE === 'undefined') {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"><\/script>');
    }
  </script>
  <!-- Código propio, legible, sin módulos ni fetch: compatible con file:// -->
  <script src="./src/escena.js"></script>
</body>
</html>
